name: Deploy Beta to Cloudflare

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  deployments: write

concurrency:
  group: crplay-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build Beta frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BETA_APP_VERSION: 0.9.0-beta
      GIT_COMMIT_SHA: ${{ github.sha }}
      BUILD_TIME: ${{ github.event.head_commit.timestamp }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:frontend
      - name: Add Beta warning and build details to the static artifact
        run: node scripts/inject-beta-build-info.mjs
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: crplay-beta-pages-${{ github.sha }}
          path: dist
          if-no-files-found: error

  online:
    name: Build Beta Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:worker
      - name: Validate isolated Beta Worker package
        run: npx wrangler deploy --dry-run --config server/wrangler.beta.jsonc
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: crplay-beta-worker-${{ github.sha }}
          path: server/dist
          if-no-files-found: error

  deploy-beta:
    name: Deploy isolated Beta resources
    needs:
      - frontend
      - online
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: crplay-beta-pages-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v8.0.1
        with:
          name: crplay-beta-worker-${{ github.sha }}
          path: server/dist
      - name: Apply Beta D1 migrations and deploy Beta Worker
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.123.0"
          preCommands: wrangler d1 migrations apply DB --remote --config server/wrangler.beta.jsonc
          command: deploy --config server/wrangler.beta.jsonc
      - name: Deploy Beta Pages
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.123.0"
          command: pages deploy dist --project-name crplay-beta-pages --branch=dev --config wrangler.beta.jsonc
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
