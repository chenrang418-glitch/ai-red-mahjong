name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  verify:
    name: Verify production build
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-pages-verify-${{ github.ref }}
      cancel-in-progress: true
    # Playwright 首次下载 Chromium/WebKit 及系统依赖可能接近 15 分钟，
    # 为完整跑完验收与部署预留空间，避免在 UI 测试开始时被强制取消。
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Install browsers for UI tests
        # WebKit 只跑四条关键路径的冒烟，但 iOS Safari 的 dvh / safe-area 差异值得盯
        run: npx playwright install --with-deps chromium webkit

      - name: Run responsive UI tests
        run: npm run test:e2e

      - name: Run online smoke test
        run: npm run test:online

      - name: Type-check frontend
        run: npm run typecheck

      - name: Type-check online server
        run: npm run typecheck:online

      - name: Build and dry-run online server
        run: npm run build:online

      - name: Build production site
        run: npm run build

      - name: Upload verified frontend
        uses: actions/upload-artifact@v4
        with:
          name: crplay-pages-${{ github.sha }}
          path: dist
          if-no-files-found: error

      - name: Upload verified Worker
        uses: actions/upload-artifact@v4
        with:
          name: crplay-worker-${{ github.sha }}
          path: server/dist
          if-no-files-found: error

  deploy:
    name: Deploy verified build
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download verified frontend
        uses: actions/download-artifact@v4
        with:
          name: crplay-pages-${{ github.sha }}
          path: dist

      - name: Download verified Worker
        uses: actions/download-artifact@v4
        with:
          name: crplay-worker-${{ github.sha }}
          path: server/dist

      - name: Deploy online Worker
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.123.0"
          preCommands: wrangler d1 migrations apply DB --remote --config server/wrangler.jsonc
          command: deploy --config server/wrangler.jsonc

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.123.0"
          command: pages deploy dist --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
