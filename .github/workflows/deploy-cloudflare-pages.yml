name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Test, build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Install browser for UI tests
        run: npx playwright install --with-deps chromium

      - name: Run responsive UI tests
        run: npm run test:e2e

      - name: Run online smoke test
        run: npm run test:online

      - name: Type-check online server
        run: npm run typecheck:online

      - name: Build online server
        run: npx vite build --config server/vite.config.ts --configLoader runner

      - name: Deploy online Worker
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.123.0"
          preCommands: wrangler d1 migrations apply DB --remote --config server/wrangler.jsonc
          command: deploy --config server/wrangler.jsonc

      - name: Build production site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.123.0"
          command: pages deploy --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
