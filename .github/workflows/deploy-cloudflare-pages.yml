name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  unit:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    concurrency:
      group: crplay-unit-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unit, engine and AI soak tests
        run: npm run test:run

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    concurrency:
      group: crplay-frontend-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check frontend
        run: npm run typecheck
      - name: Build production site without repeating typecheck
        run: npm run build:frontend
      - name: Upload verified frontend
        uses: actions/upload-artifact@v4
        with:
          name: crplay-pages-${{ github.sha }}
          path: dist
          if-no-files-found: error

  online:
    name: Online server verify and build
    runs-on: ubuntu-latest
    concurrency:
      group: crplay-online-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check online server
        run: npm run typecheck:online
      - name: Build Worker once
        run: npm run build:worker
      - name: Run online smoke against verified Worker
        run: npm run test:online:prepared
      - name: Worker production dry-run
        run: npm run dry-run:online
      - name: Upload verified Worker
        uses: actions/upload-artifact@v4
        with:
          name: crplay-worker-${{ github.sha }}
          path: server/dist
          if-no-files-found: error

  e2e:
    name: Chromium and WebKit E2E
    runs-on: ubuntu-latest
    concurrency:
      group: crplay-e2e-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read Playwright version
        id: playwright-version
        shell: bash
        run: echo "version=$(node -p \"require('./node_modules/@playwright/test/package.json').version\")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser binaries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium webkit
      - name: Run responsive UI tests
        run: npm run test:e2e

  deploy:
    name: Deploy verified build
    needs:
      - unit
      - frontend
      - online
      - e2e
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: crplay-pages-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: crplay-worker-${{ github.sha }}
          path: server/dist
      - name: Apply D1 migrations and deploy online Worker
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.123.0"
          preCommands: wrangler d1 migrations apply DB --remote --config server/wrangler.jsonc
          command: deploy --config server/wrangler.jsonc
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.123.0"
          command: pages deploy dist --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
